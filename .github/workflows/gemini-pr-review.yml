name: Gemini PR Reviewer for Technical Articles

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: |
      github.event.issue.pull_request && 
      contains(github.event.comment.body, '@gemini-cli /review')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini PR Reviewer
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are a professional writer of technical articles.
            Please review the git diff of this pull request and provide feedback in Japanese.

            Review Criteria:
            1. Title & Introduction clarity
            2. Logical structure and readability
            3. Accuracy of code and commands
            4. Typos and natural Japanese

            Output Format:
            - 総括（Overall Impression）
            - 改善点リスト（重要度 High/Medium/Low、該当箇所、具体的な改善案）